name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files (offline libs)
        run: |
          mkdir -p www/lib
          npm pack three@0.128.0 pako@2.1.0
          tar xzf three-0.128.0.tgz package/build/three.min.js package/examples/js/loaders/GLTFLoader.js
          cp package/build/three.min.js www/lib/
          cp package/examples/js/loaders/GLTFLoader.js www/lib/
          rm -rf package
          tar xzf pako-2.1.0.tgz package/dist/pako.min.js
          cp package/dist/pako.min.js www/lib/
          rm -rf package *.tgz
          cp index.html www/index.html
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#lib/three.min.js#; s#https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js#lib/GLTFLoader.js#; s#https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js#lib/pako.min.js#' www/index.html

      - name: Create Capacitor project
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Real Fishing World 3D" com.baneesroi.fishing --web-dir=www
          npx cap add android
          npx cap sync android
          sed -i 's#<activity#<activity android:screenOrientation="sensorLandscape"#' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: fishing-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
